name: Gemini API Diagnostic

on:
  workflow_dispatch:

jobs:
  test-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Check API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY tidak terbaca."
            exit 1
          fi

          echo "GEMINI_API_KEY terbaca dari GitHub Secret."

      - name: List available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s \
            "https://generativelanguage.googleapis.com/v1beta/models" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            > models.json

          cat models.json

          if grep -q '"models"' models.json; then
            echo "MODEL LIST SUCCESS"
          else
            echo "MODEL LIST FAILED"
            exit 1
          fi
