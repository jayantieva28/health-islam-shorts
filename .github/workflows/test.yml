name: Generate and Fact Check

on:
  workflow_dispatch:

jobs:
  generate-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate script with OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/generate_script.py

      - name: Fact check script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/fact_check.py

      - name: Show script
        run: |
          echo "===== GENERATED SCRIPT ====="
          cat output/script.txt

      - name: Show fact check
        run: |
          echo "===== FACT CHECK ====="
          cat output/fact_check.txt

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: script-and-fact-check
          path: output/
