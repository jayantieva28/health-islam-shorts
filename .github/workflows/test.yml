name: Gemini API Test

on:
  workflow_dispatch:

jobs:
  test-gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Test Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          RESPONSE=$(curl -s \
            -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent" \
            -H "Content-Type: application/json" \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -d '{
              "contents": [
                {
                  "parts": [
                    {
                      "text": "Reply with exactly: GEMINI CONNECTION SUCCESS"
                    }
                  ]
                }
              ]
            }')

          echo "$RESPONSE"

          if echo "$RESPONSE" | grep -q "GEMINI CONNECTION SUCCESS"; then
            echo "GEMINI API TEST SUCCESS"
          else
            echo "GEMINI API TEST FAILED"
            exit 1
          fi
