name: Generate Video

on:
  workflow_dispatch:

jobs:
  video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install FFmpeg and Piper
      run: |
      sudo apt-get update
      sudo apt-get install -y ffmpeg
      python3 -m pip install --upgrade pip
      pip install piper-tts

      - name: Generate script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/generate_script.py

      - name: Fact check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/fact_check.py

      - name: Generate voice
        run: |
          python3 scripts/voice.py

      - name: Create Shorts video
        run: |
          python3 scripts/make_video.py

      - name: Show generated files
        run: |
          ls -lh output/

      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: |
            output/script.txt
            output/fact_check.txt
            output/voice.wav
            output/short.mp4
