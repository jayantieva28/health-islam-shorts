name: Generate Video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Piper
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          pip install piper-tts

      - name: Generate script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/generate_script.py

      - name: Show selected topic
        run: |
          echo "======================================"
          echo "SELECTED TOPIC"
          echo "======================================"
          cat output/topic.txt
          echo ""
          echo "======================================"
          echo "SCRIPT"
          echo "======================================"
          cat output/script.txt

      - name: Fact check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/fact_check.py

      - name: Show fact check
        run: |
          echo "======================================"
          echo "FACT CHECK"
          echo "======================================"
          cat output/fact_check.txt

      - name: Generate voice
        run: |
          python3 scripts/voice.py

      - name: Download video clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          pip install requests
          python3 scripts/get_video.py

      - name: Show downloaded clips
        run: |
          echo "===== DOWNLOADED VIDEO CLIPS ====="
          ls -lh output/clips/

      - name: Upload video clips
        uses: actions/upload-artifact@v4
        with:
          name: video-clips
          path: output/clips/

      - name: Create Shorts video
        run: |
          python3 scripts/make_video.py

      - name: Upload final Shorts
        uses: actions/upload-artifact@v4
        with:
          name: final-short
          path: output/short.mp4

      - name: Show generated files
        run: |
          ls -lh output/

      - name: Upload Shorts
        uses: actions/upload-artifact@v4
        with:
          name: shorts-video
          path: |
            output/topic.txt
            output/script.txt
            output/fact_check.txt
            output/subtitles.srt
            output/voice.wav
            output/short.mp4

      - name: Mark topic as DONE
        run: |
          python3 scripts/mark_topic_done.py

      - name: Show updated topic database
        run: |
          echo "======================================"
          echo "UPDATED TOPIC DATABASE"
          echo "======================================"
          cat topics.csv

      - name: Commit topic status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add topics.csv

          git diff --cached --quiet || git commit -m "Mark completed topic as DONE"

          git push
