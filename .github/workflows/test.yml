name: V2 Test

on:
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Python
        run: |
          python3 --version

      - name: Check FFmpeg
        run: |
          ffmpeg -version

      - name: Run video generator
        run: |
          python3 scripts/test_pipeline.py

      - name: Upload generated video
        uses: actions/upload-artifact@v4
        with:
          name: test-short
          path: output/test_short.mp4
