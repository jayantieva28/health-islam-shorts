name: Generate Video

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"
    - cron: "0 13 * * *"

concurrency:
  group: tayyib-health-notes-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg and Piper
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade pip
          pip install piper-tts

      - name: Generate script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/generate_script.py

      - name: Show selected topic
        run: |
          echo "======================================"
          echo "SELECTED TOPIC"
          echo "======================================"
          cat output/topic.txt
          echo ""
          echo "======================================"
          echo "SCRIPT"
          echo "======================================"
          cat output/script.txt

      - name: Fact check
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python3 scripts/fact_check.py

      - name: Show fact check
        run: |
          echo "======================================"
          echo "FACT CHECK"
          echo "======================================"
          cat output/fact_check.txt

      - name: Generate voice
        run: |
          python3 scripts/voice.py

      - name: Download video clips
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          pip install requests
          python3 scripts/get_video.py

      - name: Show downloaded clips
        run: |
          echo "===== DOWNLOADED VIDEO CLIPS ====="
          ls -lh output/clips/

      - name: Create Shorts video
        run: |
          python3 scripts/make_video.py

      - name: Show generated files
        run: |
          echo "======================================"
          echo "GENERATED FILES"
          echo "======================================"
          ls -lh output/

          echo ""
          echo "======================================"
          echo "FINAL VIDEO"
          echo "======================================"
          ls -lh output/short.mp4

      - name: Mark topic as DONE
        run: |
          python3 scripts/mark_topic_done.py

      - name: Show updated topic database
        run: |
          echo "======================================"
          echo "UPDATED TOPIC DATABASE"
          echo "======================================"
          cat topics.csv

      - name: Commit topic status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add topics.csv

          git diff --cached --quiet || git commit -m "Mark completed topic as DONE"

          git push

      - name: Create GitHub Release with MP4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="short-$(date -u +%Y%m%d-%H%M%S)"

          echo "======================================"
          echo "CREATING RELEASE"
          echo "======================================"
          echo "Release tag: $TAG"

          gh release create "$TAG" \
            output/short.mp4 \
            --title "Tayyib Health Notes - $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --notes "Automatically generated YouTube Short for Tayyib Health Notes."

          echo ""
          echo "======================================"
          echo "RELEASE CREATED"
          echo "======================================"

          gh release view "$TAG" --json url --jq '.url'
