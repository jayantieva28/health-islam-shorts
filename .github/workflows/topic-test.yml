name: Topic Database Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-topic:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Generate script from next READY topic
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/generate_script.py

      - name: Show selected topic
        run: |
          echo "======================================"
          echo "SELECTED TOPIC"
          echo "======================================"
          cat output/topic.txt
          echo ""
          echo "======================================"
          echo "GENERATED SCRIPT"
          echo "======================================"
          cat output/script.txt

      - name: Mark topic as DONE
        run: |
          python scripts/mark_topic_done.py

      - name: Show updated database
        run: |
          echo "======================================"
          echo "UPDATED TOPIC DATABASE"
          echo "======================================"
          cat topics.csv

      - name: Commit updated topic database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add topics.csv

          git diff --cached --quiet || git commit -m "Update topic status"

          git push
